[project]
name = "yargucu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dijitaltup HOME", email = "harunemirhan826@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "graphviz>=0.21",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "typer>=0.27.3",
    "xgboost>=3.2.0",
]

[project.scripts]
yargucu = "yargucu:main"

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
